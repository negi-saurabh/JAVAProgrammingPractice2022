spring:

  datasource:
    url: jdbc:h2:mem:paymentsdb
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
  h2:
    console:
      enabled: true 
  kafka:
    bootstrap-servers: localhost:9092

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all                        # wait for all in-sync replicas
      retries: 3
      properties:
        enable.idempotence: true       # exactly-once from producer side
        max.in.flight.requests.per.connection: 1

    consumer:
      group-id: payments-app
      key-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
          spring.deserializer.key.delegate.class: org.apache.kafka.common.serialization.StringDeserializer
          spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
          spring.json.trusted.packages: "com.saurabh.kafka.model"
          spring.json.value.default.type: "com.saurabh.kafka.model.PaymentEvent"
      auto-offset-reset: earliest      # start from beginning if no offset exists
      enable-auto-commit: false        # WE control when offset is committed


    listener:
      ack-mode: MANUAL_IMMEDIATE       # ties to enable-auto-commit: false

app:
  kafka:
    topics:
      payment-events: payment.events
      payment-dlt: payment.events.DLT